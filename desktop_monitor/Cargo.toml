[package]
name = "tradingbot-monitor"
version = "0.1.0"
edition = "2024"
description = "Low-memory native Windows monitor for the trading bot"
license = "MIT"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = true
