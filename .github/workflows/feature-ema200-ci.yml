name: Feature EMA200 CI

on:
  push:
    branches:
      - feature/ema200-rsi-trend-binance-top10
  workflow_dispatch:

jobs:
  ema200-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip check
      - name: Compile
        run: |
          python -m py_compile bot_runtime/base_engine.py bot_runtime/signal_entry.py bot_runtime/signal_scanner.py bot_runtime/signal_protection.py bot_runtime/ema200_profit_stop.py trading_safety/binance_algo_gateway.py trading_safety/order_state.py
      - name: EMA200 targeted regression
        run: python -m pytest -q tests/test_ema200_utbot_rsi_strategy.py
      - name: Protection and Binance targeted regression
        run: |
          python -m pytest -q tests/test_binance_algo_gateway.py
          python -m pytest -q tests/test_protection_order_idempotency.py
          python -m pytest -q tests/test_protection_idempotency.py
          python -m pytest -q tests/test_algo_lookup_safety.py
          python -m pytest -q tests/test_small_account_protection_contract.py
          python -m pytest -q tests/test_liquidation_guard.py
      - name: Full pytest
        run: python -m pytest -q
      - name: Diff check
        run: git diff --check origin/main...HEAD
