name: Feature EMA200 CI

on:
  push:
    branches:
      - feature/ema200-rsi-trend-binance-top10
  workflow_dispatch:

jobs:
  ema200-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip check
      - name: Compile
        run: |
          python -m py_compile bot_runtime/base_engine.py bot_runtime/signal_scanner.py bot_runtime/signal_protection.py bot_runtime/ema200_profit_stop.py
      - name: EMA200 targeted regression
        run: python -m pytest -q tests/test_ema200_utbot_rsi_strategy.py
      - name: Full pytest
        run: python -m pytest -q
      - name: Diff check
        run: git diff --check HEAD^ HEAD
